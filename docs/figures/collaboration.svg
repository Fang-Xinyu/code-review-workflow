<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-label="一次修复的协作时序"><rect width="100%" height="100%" fill="white"/><text x="560.0" y="33" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="27" fill="#172b45" text-anchor="middle" dominant-baseline="central">一次修复的协作时序</text><text x="560.0" y="66" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#52647a" text-anchor="middle" dominant-baseline="central">Agent 不直接互调，所有消息和状态由 Workflow 交接</text><rect x="15" y="105" width="170" height="55" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="100.0" y="130" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#64748b" text-anchor="middle" dominant-baseline="central">Workflow</text><polyline points="100,160 100,697" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/><rect x="295" y="105" width="170" height="55" rx="12" fill="#edf4ff" stroke="#2768bd" stroke-width="2"/><text x="380.0" y="130" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#2768bd" text-anchor="middle" dominant-baseline="central">Reviewer</text><polyline points="380,160 380,697" fill="none" stroke="#2768bd" stroke-width="2" stroke-dasharray="7 5"/><rect x="595" y="105" width="170" height="55" rx="12" fill="#eaf7f2" stroke="#157b68" stroke-width="2"/><text x="680.0" y="130" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#157b68" text-anchor="middle" dominant-baseline="central">Fixer</text><polyline points="680,160 680,697" fill="none" stroke="#157b68" stroke-width="2" stroke-dasharray="7 5"/><rect x="915" y="105" width="170" height="55" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="1000.0" y="130" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#64748b" text-anchor="middle" dominant-baseline="central">验证节点</text><polyline points="1000,160 1000,697" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/><polyline points="100,205 380,205" fill="none" stroke="#2768bd" stroke-width="2"/><polygon points="380.0,205.0 370.0,209.6 370.0,200.4" fill="#2768bd"/><text x="240.0" y="187" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#2768bd" text-anchor="middle" dominant-baseline="central">源码 → 完整审查</text><polyline points="380,260 100,260" fill="none" stroke="#2768bd" stroke-width="2"/><polygon points="100.0,260.0 110.0,255.4 110.0,264.6" fill="#2768bd"/><text x="240.0" y="242" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#2768bd" text-anchor="middle" dominant-baseline="central">确认问题与待确认事项</text><polyline points="100,325 680,325" fill="none" stroke="#157b68" stroke-width="2"/><polygon points="680.0,325.0 670.0,329.6 670.0,320.4" fill="#157b68"/><text x="390.0" y="307" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#157b68" text-anchor="middle" dominant-baseline="central">FixTask：代码、问题、固定测试、反馈</text><polyline points="680,380 100,380" fill="none" stroke="#157b68" stroke-width="2"/><polygon points="100.0,380.0 110.0,375.4 110.0,384.6" fill="#157b68"/><text x="390.0" y="362" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#157b68" text-anchor="middle" dominant-baseline="central">FixProposal：补丁、目标关联、未处理项</text><polyline points="100,445 1000,445" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="1000.0,445.0 990.0,449.6 990.0,440.4" fill="#64748b"/><text x="550.0" y="427" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#64748b" text-anchor="middle" dominant-baseline="central">应用补丁 → 静态检查 → 隔离测试</text><polyline points="1000,500 100,500" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="100.0,500.0 110.0,495.4 110.0,504.6" fill="#64748b"/><text x="550.0" y="482" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#64748b" text-anchor="middle" dominant-baseline="central">真实结果：诊断、通过项、失败项、快照</text><polyline points="100,565 380,565" fill="none" stroke="#2768bd" stroke-width="2"/><polygon points="380.0,565.0 370.0,569.6 370.0,560.4" fill="#2768bd"/><text x="240.0" y="547" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#2768bd" text-anchor="middle" dominant-baseline="central">候选与证据 → 复审及目标核对</text><polyline points="380,620 100,620" fill="none" stroke="#2768bd" stroke-width="2"/><polygon points="100.0,620.0 110.0,615.4 110.0,624.6" fill="#2768bd"/><text x="240.0" y="602" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#2768bd" text-anchor="middle" dominant-baseline="central">逐项目标裁决与剩余问题</text><rect x="260" y="688" width="600" height="55" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="560.0" y="713" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#64748b" text-anchor="middle" dominant-baseline="central">Workflow 综合证据，决定是否接受</text></svg>