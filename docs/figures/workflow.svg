<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1270" viewBox="0 0 1120 1270" role="img" aria-label="CodeFlow 主流程"><rect width="100%" height="100%" fill="white"/><text x="560.0" y="33" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="27" fill="#172b45" text-anchor="middle" dominant-baseline="central">CodeFlow 主流程</text><text x="560.0" y="66" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#52647a" text-anchor="middle" dominant-baseline="central">初审先于测试生成；所有候选使用同一套固定测试</text><rect x="340" y="100" width="440" height="73" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="560.0" y="125" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#64748b" text-anchor="middle" dominant-baseline="central">输入初始化</text><text x="560.0" y="155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">原始快照与任务目录</text><polyline points="560,173 560,195" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="560.0,195.0 555.4,185.0 564.6,185.0" fill="#64748b"/><rect x="340" y="195" width="440" height="73" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="560.0" y="220" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#64748b" text-anchor="middle" dominant-baseline="central">隔离环境预检</text><text x="560.0" y="250" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">仅自动修复需要；失败不调用模型</text><polyline points="560,268 560,290" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="560.0,290.0 555.4,280.0 564.6,280.0" fill="#64748b"/><rect x="340" y="290" width="440" height="73" rx="12" fill="#edf4ff" stroke="#2768bd" stroke-width="2"/><text x="560.0" y="315" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#2768bd" text-anchor="middle" dominant-baseline="central">Reviewer 完整初审</text><text x="560.0" y="345" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">确认问题 / 待确认事项</text><polyline points="560,363 560,385" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="560.0,385.0 555.4,375.0 564.6,375.0" fill="#64748b"/><rect x="340" y="385" width="440" height="73" rx="12" fill="#edf4ff" stroke="#2768bd" stroke-width="2"/><text x="560.0" y="410" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#2768bd" text-anchor="middle" dominant-baseline="central">准备并固定测试</text><text x="560.0" y="440" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">用户提供，或 Reviewer 生成并复核</text><polyline points="560,458 560,480" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="560.0,480.0 555.4,470.0 564.6,470.0" fill="#64748b"/><rect x="340" y="480" width="440" height="73" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="560.0" y="505" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#64748b" text-anchor="middle" dominant-baseline="central">运行原始测试基线</text><text x="560.0" y="535" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">记录原始通过项与真实失败</text><polyline points="560,553 560,575" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="560.0,575.0 555.4,565.0 564.6,565.0" fill="#64748b"/><rect x="340" y="575" width="440" height="73" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="560.0" y="600" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#64748b" text-anchor="middle" dominant-baseline="central">选择本轮目标</text><text x="560.0" y="630" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">每轮 ≤ 5 个目标；检查剩余额度</text><polyline points="560,648 560,670" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="560.0,670.0 555.4,660.0 564.6,660.0" fill="#64748b"/><rect x="340" y="670" width="440" height="73" rx="12" fill="#eaf7f2" stroke="#157b68" stroke-width="2"/><text x="560.0" y="695" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#157b68" text-anchor="middle" dominant-baseline="central">Fixer 提出补丁</text><text x="560.0" y="725" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">最多 10 处；只改说明不算修复</text><polyline points="560,743 560,765" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="560.0,765.0 555.4,755.0 564.6,755.0" fill="#64748b"/><rect x="340" y="765" width="440" height="73" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="560.0" y="790" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#64748b" text-anchor="middle" dominant-baseline="central">补丁与静态检查</text><text x="560.0" y="820" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">协议、快照、AST、Ruff、保护约束</text><polyline points="560,838 560,860" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="560.0,860.0 555.4,850.0 564.6,850.0" fill="#64748b"/><rect x="340" y="860" width="440" height="73" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="560.0" y="885" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#64748b" text-anchor="middle" dominant-baseline="central">候选测试与回归比较</text><text x="560.0" y="915" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">保留改善版本；回归则回退</text><polyline points="560,933 560,955" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="560.0,955.0 555.4,945.0 564.6,945.0" fill="#64748b"/><rect x="340" y="955" width="440" height="73" rx="12" fill="#edf4ff" stroke="#2768bd" stroke-width="2"/><text x="560.0" y="980" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#2768bd" text-anchor="middle" dominant-baseline="central">Reviewer 完整复审</text><text x="560.0" y="1010" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">确认新问题；最多 3 次完整复审</text><polyline points="560,1028 560,1050" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="560.0,1050.0 555.4,1040.0 564.6,1040.0" fill="#64748b"/><rect x="340" y="1050" width="440" height="73" rx="12" fill="#edf4ff" stroke="#2768bd" stroke-width="2"/><text x="560.0" y="1075" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#2768bd" text-anchor="middle" dominant-baseline="central">Reviewer 逐项目标核对</text><text x="560.0" y="1105" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">测试完整通过后才进入</text><polyline points="560,1123 560,1145" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="560.0,1145.0 555.4,1135.0 564.6,1135.0" fill="#64748b"/><rect x="340" y="1145" width="440" height="73" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="560.0" y="1170" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#64748b" text-anchor="middle" dominant-baseline="central">汇总结果与输出</text><text x="560.0" y="1200" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">接受 / 部分修改 / 未采用 / 错误</text><polyline points="340,137 135,137 135,327 340,327" fill="none" stroke="#2768bd" stroke-width="2"/><polygon points="340.0,327.0 330.0,331.6 330.0,322.4" fill="#2768bd"/><text x="190" y="118" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#2768bd" text-anchor="middle" dominant-baseline="central">仅审查</text><polyline points="340,327 85,327 85,1182 340,1182" fill="none" stroke="#2768bd" stroke-width="2"/><polygon points="340.0,1182.0 330.0,1186.6 330.0,1177.4" fill="#2768bd"/><text x="190" y="1163" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#2768bd" text-anchor="middle" dominant-baseline="central">仅审查完成</text><polyline points="340,516 235,516 235,1182 340,1182" fill="none" stroke="#b66613" stroke-width="2"/><polygon points="340.0,1182.0 330.0,1186.6 330.0,1177.4" fill="#b66613"/><polyline points="340,611 235,611" fill="none" stroke="#b66613" stroke-width="2"/><text x="160" y="675" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#b66613" text-anchor="middle" dominant-baseline="central">无需修改</text><text x="160" y="700" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#b66613" text-anchor="middle" dominant-baseline="central">或无法继续</text><polyline points="780,801 870,801 870,611 780,611" fill="none" stroke="#b66613" stroke-width="2"/><polygon points="780.0,611.0 790.0,606.4 790.0,615.6" fill="#b66613"/><text x="910" y="821" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#b66613" text-anchor="middle" dominant-baseline="central">静态失败可重试</text><polyline points="780,896 955,896 955,611 780,611" fill="none" stroke="#157b68" stroke-width="2"/><polygon points="780.0,611.0 790.0,606.4 790.0,615.6" fill="#157b68"/><text x="910" y="916" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#157b68" text-anchor="middle" dominant-baseline="central">测试后仍有目标</text><polyline points="780,991 1040,991 1040,611 780,611" fill="none" stroke="#2768bd" stroke-width="2"/><polygon points="780.0,611.0 790.0,606.4 790.0,615.6" fill="#2768bd"/><text x="910" y="1011" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#2768bd" text-anchor="middle" dominant-baseline="central">复审确认可回修</text><text x="560" y="1244" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#172b45" text-anchor="middle" dominant-baseline="central">各阶段发生错误、证据不足、拒绝或预算耗尽时，统一结束并报告原因。</text></svg>