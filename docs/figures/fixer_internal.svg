<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1300" viewBox="0 0 1380 1300" role="img" aria-label="Fixer 内部：模型、工具与程序检查"><rect width="100%" height="100%" fill="white"/><text x="690.0" y="33" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="27" fill="#172b45" text-anchor="middle" dominant-baseline="central">Fixer 内部：模型、工具与程序检查</text><text x="690.0" y="66" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#52647a" text-anchor="middle" dominant-baseline="central">两次逻辑模型调用上限；静态分析和工具执行不计为模型调用</text><rect x="460" y="105" width="500" height="85" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="710.0" y="130" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#64748b" text-anchor="middle" dominant-baseline="central">接收 FixTask</text><text x="710.0" y="160" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">当前源码 · 确认问题 · 固定测试 · 反馈</text><polyline points="710,190 710,225" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="710.0,225.0 705.4,215.0 714.6,215.0" fill="#64748b"/><rect x="460" y="225" width="500" height="85" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="710.0" y="250" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#64748b" text-anchor="middle" dominant-baseline="central">程序准备上下文</text><text x="710.0" y="280" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">运行 AST / Ruff，构建只读取证工具</text><polyline points="710,310 710,350" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="710.0,350.0 705.4,340.0 714.6,340.0" fill="#64748b"/><rect x="460" y="350" width="500" height="90" rx="12" fill="#edf4ff" stroke="#2768bd" stroke-width="2"/><text x="710.0" y="375" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#2768bd" text-anchor="middle" dominant-baseline="central">模型调用 1</text><text x="710.0" y="405" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">任务 + 输出 schema + TOOL_SCHEMAS</text><polyline points="710,440 710,480" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="710.0,480.0 705.4,470.0 714.6,470.0" fill="#64748b"/><rect x="460" y="480" width="500" height="75" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="710.0" y="505" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#64748b" text-anchor="middle" dominant-baseline="central">程序分辨返回类型</text><text x="710.0" y="535" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">直接 JSON 提议，或 tool_calls</text><polyline points="460,515 200,515 200,585" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="200.0,585.0 195.4,575.0 204.6,575.0" fill="#64748b"/><text x="290" y="495" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">JSON 提议</text><rect x="40" y="585" width="320" height="105" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="200.0" y="610" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#64748b" text-anchor="middle" dominant-baseline="central">程序检查首次提议</text><text x="200.0" y="640" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">schema、任务 / 目标标识</text><text x="200.0" y="665" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">原文定位、可执行代码变化</text><polyline points="960,515 1190,515 1190,585" fill="none" stroke="#157b68" stroke-width="2"/><polygon points="1190.0,585.0 1185.4,575.0 1194.6,575.0" fill="#157b68"/><text x="1110" y="495" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#157b68" text-anchor="middle" dominant-baseline="central">tool_calls</text><rect x="1040" y="585" width="300" height="105" rx="12" fill="#eaf7f2" stroke="#157b68" stroke-width="2"/><text x="1190.0" y="610" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#157b68" text-anchor="middle" dominant-baseline="central">只读工具执行</text><text x="1190.0" y="640" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">先核对数量，最多 5 个</text><text x="1190.0" y="665" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">结果写入 tool_observations</text><polyline points="1190,690 1190,825 960,825" fill="none" stroke="#157b68" stroke-width="2"/><polygon points="960.0,825.0 970.0,820.4 970.0,829.6" fill="#157b68"/><text x="1115" y="802" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#157b68" text-anchor="middle" dominant-baseline="central">补充工具观察</text><polyline points="360,638 410,638 410,825 460,825" fill="none" stroke="#b66613" stroke-width="2"/><polygon points="460.0,825.0 450.0,829.6 450.0,820.4" fill="#b66613"/><text x="340" y="716" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#b66613" text-anchor="middle" dominant-baseline="central">可纠正</text><text x="340" y="743" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#b66613" text-anchor="middle" dominant-baseline="central">则反馈</text><rect x="460" y="780" width="500" height="90" rx="12" fill="#edf4ff" stroke="#2768bd" stroke-width="2"/><text x="710.0" y="805" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#2768bd" text-anchor="middle" dominant-baseline="central">模型调用 2（按需）</text><text x="710.0" y="835" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">更新上下文 + tools=None；必须提交最终结果</text><polyline points="710,870 710,925" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="710.0,925.0 705.4,915.0 714.6,915.0" fill="#64748b"/><rect x="460" y="925" width="500" height="100" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="710.0" y="950" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#64748b" text-anchor="middle" dominant-baseline="central">程序检查最终响应</text><text x="710.0" y="980" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">禁止继续请求工具</text><text x="710.0" y="1005" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">协议、快照标识、补丁及纯文档检查</text><polyline points="960,975 1040,975" fill="none" stroke="#b84242" stroke-width="2"/><polygon points="1040.0,975.0 1030.0,979.6 1030.0,970.4" fill="#b84242"/><text x="1000" y="951" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#b84242" text-anchor="middle" dominant-baseline="central">无效</text><rect x="1040" y="925" width="300" height="100" rx="12" fill="#fff0ef" stroke="#b84242" stroke-width="2"/><text x="1190.0" y="950" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#b84242" text-anchor="middle" dominant-baseline="central">报错并停止</text><text x="1190.0" y="980" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">再次无效或仍请求工具</text><text x="1190.0" y="1005" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">请求错误 / 工具数量超限</text><polyline points="1190,690 1360,690 1360,975 1340,975" fill="none" stroke="#b84242" stroke-width="2"/><polygon points="1340.0,975.0 1350.0,970.4 1350.0,979.6" fill="#b84242"/><text x="1255" y="735" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#b84242" text-anchor="middle" dominant-baseline="central">超限即停</text><polyline points="710,1025 710,1130" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="710.0,1130.0 705.4,1120.0 714.6,1120.0" fill="#64748b"/><text x="783" y="1080" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">有效</text><polyline points="200,690 200,1175 460,1175" fill="none" stroke="#157b68" stroke-width="2"/><polygon points="460.0,1175.0 450.0,1179.6 450.0,1170.4" fill="#157b68"/><text x="310" y="950" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#157b68" text-anchor="middle" dominant-baseline="central">首次有效则直接返回</text><rect x="460" y="1130" width="500" height="90" rx="12" fill="#eaf7f2" stroke="#157b68" stroke-width="2"/><text x="710.0" y="1155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#157b68" text-anchor="middle" dominant-baseline="central">FixProposal → Workflow</text><text x="710.0" y="1185" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">合法补丁 / cannot_fix；不自行宣布修复成功</text><text x="710" y="1260" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">工具分支与纠正分支共用第二次调用额度，不能在工具调用后再额外增加一次纠正。</text></svg>