<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-label="代码快照与候选保留"><rect width="100%" height="100%" fill="white"/><text x="560.0" y="33" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="27" fill="#172b45" text-anchor="middle" dominant-baseline="central">代码快照与候选保留</text><text x="560.0" y="66" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#52647a" text-anchor="middle" dominant-baseline="central">保留工作版本与最终接受是两个不同判断</text><rect x="40" y="125" width="300" height="100" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="190.0" y="150" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#64748b" text-anchor="middle" dominant-baseline="central">original_code</text><text x="190.0" y="180" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">原始代码与哈希固定</text><rect x="410" y="125" width="300" height="100" rx="12" fill="#edf4ff" stroke="#2768bd" stroke-width="2"/><text x="560.0" y="150" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#2768bd" text-anchor="middle" dominant-baseline="central">working_code</text><text x="560.0" y="180" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">当前保留的修复基准</text><rect x="780" y="125" width="300" height="100" rx="12" fill="#eaf7f2" stroke="#157b68" stroke-width="2"/><text x="930.0" y="150" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#157b68" text-anchor="middle" dominant-baseline="central">candidate</text><text x="930.0" y="180" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#172b45" text-anchor="middle" dominant-baseline="central">Fixer 本轮提出的版本</text><polyline points="340,175 410,175" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="410.0,1